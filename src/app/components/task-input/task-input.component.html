<input
  (keydown.enter)="handleAddTaskButtonClicked(taskInput)"
  (input)="controlInputState(taskInput.value)"
  #taskInput
  type="text"
  placeholder="Enter a task"
  [class.input-error]="hasError()"
/>
@if (errorMessage()) {
  <p class="error-message">{{ errorMessage() }}</p>
}
<app-button
  (onButtonCLick)="handleAddTaskButtonClicked(taskInput)"
  [buttonName]="editMode() ? 'Update Task' : 'Add Task'"
  buttonClass="add-button"
></app-button>
