<div class="input-wrap" [class.editing]="editMode()">
  @if (editMode()) {
    <span class="edit-badge">Editing</span>
  }
  <div class="input-row">
    <input
      (keydown.enter)="handleAddTaskButtonClicked(taskInput)"
      (keydown.escape)="cancelEdit(taskInput)"
      (input)="controlInputState(taskInput.value)"
      #taskInput
      type="text"
      [placeholder]="editMode() ? 'Update task name…' : 'Add a new task…'"
      [class.input-error]="hasError()"
    />
    <div class="action-buttons">
      @if (editMode()) {
        <button class="btn btn-ghost" type="button" (click)="cancelEdit(taskInput)">
          Cancel
        </button>
      }
      <button
        class="btn btn-primary"
        type="button"
        (click)="handleAddTaskButtonClicked(taskInput)"
      >
        @if (editMode()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Update
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add
        }
      </button>
    </div>
  </div>
  @if (errorMessage()) {
    <p class="error-message">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ errorMessage() }}
    </p>
  }
</div>
