<div cdkDropList (cdkDropListDropped)="drop($event)" class="displayer">
  @for(data of taskService.Tasks(); track $index) {
  <div cdkDrag class="task-drag-item">
    <app-single-task
      (editOrDeleteButtonsClicked)="handleSideButtonsClicked($event, $index)"
      [taskName]="data.taskname"
    ></app-single-task>
    <div class="drag-placeholder" *cdkDragPlaceholder></div>
  </div>
  }
</div>
